<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FullFocus — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span class="brand-name">FullFocus</span>
      </div>
      <h1 class="auth-title">Tu estudio, en orden</h1>
      <p class="auth-subtitle">Organiza tus materias y avanza con calma</p>

      <div id="error-msg" class="auth-error"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Iniciar sesión</button>
        <p class="auth-switch">¿No tenés cuenta? <a href="#" id="show-register">Registrate</a></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-name">Nombre</label>
          <input type="text" id="reg-name" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirmar contraseña</label>
          <input type="password" id="reg-confirm" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Crear cuenta</button>
        <p class="auth-switch">¿Ya tenés cuenta? <a href="#" id="show-login">Iniciá sesión</a></p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
